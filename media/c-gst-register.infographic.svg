<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1573" width="900" height="1573" role="img" aria-labelledby="t d" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif">
<title id="t">生意还没赚钱，也可能要注册和收取GST/HST吗？</title>
<desc id="d">可能。门槛数的是应税供应，不是利润：小供应商门槛 30,000 元，按本人全部生意连同关联人的全球应税供应来数。出租车与商业网约车不论收入多少，第一天就必须注册。</desc>
<rect width="900" height="1573" fill="#FAFBFC"/>
<rect x="0" y="0" width="900" height="122" rx="0" fill="#12355B"/>
<text x="40" y="46" font-size="18" fill="#BFD3E6" font-weight="500" text-anchor="start">营业税注册与亏损无关 · 信息图</text>
<text x="40" y="92" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="start">生意还没赚钱，也可能要注册和收取GST/HST吗？</text>
<rect x="40" y="146" width="820" height="165" rx="16" fill="#FFFFFF" stroke="#12355B" stroke-width="2"/>
<text x="64" y="177" font-size="17" fill="#0E7C7B" font-weight="700" text-anchor="start">一句话答案</text>
<text x="64" y="213" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">可能。门槛数的是应税供应，不是利润：小供应商门槛 30,000 元，按本人全部</text>
<text x="64" y="246" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">生意连同关联人的全球应税供应来数。出租车与商业网约车不论收入多少，第一天</text>
<text x="64" y="279" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">就必须注册。</text>
<text x="40" y="355" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">三条不同的刻度</text>
<rect x="40.0" y="375" width="264.0" height="298" rx="14" fill="#EAF1F8" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="54.0" y="407" font-size="19" fill="#2F5D8A" font-weight="700" text-anchor="start">应税供应</text>
<text x="54.0" y="435" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">算什么</text>
<text x="54.0" y="457" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">全球应税供应，含零税率供应；</text>
<text x="54.0" y="480" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">豁免供应不计入</text>
<text x="54.0" y="514" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">加谁的</text>
<text x="54.0" y="536" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">名下全部生意，加上关联人的应</text>
<text x="54.0" y="560" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">税供应</text>
<text x="54.0" y="594" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">剔除</text>
<text x="54.0" y="616" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">金融服务收入、资本财产的处置</text>
<text x="54.0" y="639" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">与出售企业的商誉</text>
<rect x="318.0" y="375" width="264.0" height="298" rx="14" fill="#F4F6F9" stroke="#5B6B7F" stroke-width="1.5"/>
<text x="332.0" y="407" font-size="19" fill="#5B6B7F" font-weight="700" text-anchor="start">利润</text>
<text x="332.0" y="435" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">是什么</text>
<text x="332.0" y="457" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">所得税那一侧的数</text>
<text x="332.0" y="514" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">对注册的作用</text>
<text x="332.0" y="536" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">注册义务以应税供应等条件判</text>
<text x="332.0" y="560" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">断，不能用是否盈利代替</text>
<text x="332.0" y="594" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">亏损时</text>
<text x="332.0" y="616" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">照样可能过线</text>
<rect x="596.0" y="375" width="264.0" height="298" rx="14" fill="#FDECEA" stroke="#B42318" stroke-width="1.5"/>
<text x="610.0" y="407" font-size="19" fill="#B42318" font-weight="700" text-anchor="start">注册义务</text>
<text x="610.0" y="435" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">一般门槛</text>
<text x="610.0" y="457" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">30,000 元，自 1991 年未</text>
<text x="610.0" y="480" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">变、不指数化</text>
<text x="610.0" y="514" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">出租车与网约车</text>
<text x="610.0" y="536" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">不论收入多少，第一天就必须注</text>
<text x="610.0" y="560" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">册</text>
<text x="610.0" y="594" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">时限</text>
<text x="610.0" y="616" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">生效日后 29 天内完成注册</text>
<text x="40" y="717" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">超过 30,000 元有两条路径</text>
<rect x="40" y="735" width="820" height="129" rx="14" fill="#FDECEA" stroke="#B42318" stroke-width="1.5"/>
<text x="58" y="769" font-size="20" fill="#B42318" font-weight="700" text-anchor="start">路径一：单个日历季度内超过</text>
<circle cx="64" cy="798" r="3.2" fill="#B42318"/>
<text x="76" y="803" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">从使你超过 30,000 元的那一笔供应起就不再是小供应商，那一笔本身就要收税</text>
<circle cx="64" cy="830" r="3.2" fill="#B42318"/>
<text x="76" y="835" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">没有任何缓冲期</text>
<rect x="40" y="886" width="820" height="129" rx="14" fill="#FFF4E5" stroke="#B45309" stroke-width="1.5"/>
<text x="58" y="920" font-size="20" fill="#B45309" font-weight="700" text-anchor="start">路径二：连续四个（或更少）日历季度累计超过</text>
<circle cx="64" cy="949" r="3.2" fill="#B45309"/>
<text x="76" y="954" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">没有任何单季超过时，在超过所在季度结束后的下一个月末失去小供应商身份</text>
<circle cx="64" cy="981" r="3.2" fill="#B45309"/>
<text x="76" y="986" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">从此后的第一笔供应起收税，大约一个月的缓冲</text>
<rect x="40" y="1037" width="820" height="129" rx="14" fill="#E9F7EF" stroke="#1A7F4B" stroke-width="1.5"/>
<text x="58" y="1071" font-size="20" fill="#1A7F4B" font-weight="700" text-anchor="start">没到门槛：可以自愿注册</text>
<circle cx="64" cy="1100" r="3.2" fill="#1A7F4B"/>
<text x="76" y="1105" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">生效日通常是你提出申请那天，也可以往前回溯最多 30 天</text>
<circle cx="64" cy="1132" r="3.2" fill="#1A7F4B"/>
<text x="76" y="1137" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">客户全是企业、开办期投入大、做出口或其他零税率供应时，自愿注册常常划算</text>
<rect x="40" y="1188" width="820" height="218" rx="14" fill="#FFF4E5" stroke="#B45309" stroke-width="1.5"/>
<text x="58" y="1222" font-size="20" fill="#B45309" font-weight="700" text-anchor="start">最容易弄错</text>
<circle cx="64" cy="1251" r="3.2" fill="#B45309"/>
<text x="76" y="1256" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">「生意亏损就不用注册 GST/HST」：注册看应税供应等条件，不看是否盈利。</text>
<circle cx="64" cy="1283" r="3.2" fill="#B45309"/>
<text x="76" y="1288" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">「两份生意各自没到 30,000 元」：门槛是按人算的，不是按生意算的，合计过线就过线。</text>
<circle cx="64" cy="1314" r="3.2" fill="#B45309"/>
<text x="76" y="1319" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">「平台的 30 笔、2,800 元就是门槛」：那只决定平台要不要报你的信息，不改变你自己要不要注</text>
<text x="76" y="1345" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">册。</text>
<circle cx="64" cy="1371" r="3.2" fill="#B45309"/>
<text x="76" y="1376" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">送餐、代购、代跑腿类平台工作不属于客运，仍按一般 30,000 元门槛处理。</text>
<line x1="40" y1="1432" x2="860" y2="1432" stroke="#D5DEE8" stroke-width="1.5"/>
<text x="40" y="1457" font-size="15" fill="#5B6B7F" font-weight="700" text-anchor="start">来源</text>
<text x="40" y="1479" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">CRA · When to register for and start charging the GST/HST（canada.ca）</text>
<text x="40" y="1501" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">CRA · GST/HST information for taxi operators and commercial ride-sharing drivers（canada.ca）</text>
<text x="40" y="1529" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">本页正文核实日 2026-10-30。部分行业另有规则；本图只列判断门槛的刻度，不替个案判定注册义务。</text>
</svg>
